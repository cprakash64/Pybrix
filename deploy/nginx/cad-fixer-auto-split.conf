# Pybrix — Auto Split (Beta) analysis service, OPTIONAL.
#
# Installed on the server as:
#   /etc/nginx/snippets/cad-fixer-auto-split.conf
#
# `zz-cad-fixer.conf.template` includes `cad-fixer-auto-split*.conf` with a glob that may match
# nothing, so a site WITHOUT this file is the static site it always was: /api/auto-split/ is then a
# plain 404, Auto Split's Find parts reports that the service is unavailable, and Repair, Convert and
# Manual Split are unaffected.
#
# WHAT THIS PROXIES. Exactly one path, to one loopback port, for one purpose: the browser POSTs six
# rendered PNGs and three bounded numbers to its own origin and the service answers. No model file
# ever reaches it (the service refuses a body that carries geometry), and nothing here is a general
# proxy: there is no variable in `proxy_pass`, no rewrite, no upstream block and no other location.
#
# THE SERVICE LISTENS ON 127.0.0.1 ONLY (AUTO_SPLIT_HOST), so it is reachable through this location
# and from nowhere else. `X-Real-IP` is set here from the socket, never passed through from the
# client, and the service trusts it only when started with AUTO_SPLIT_TRUST_PROXY=1.
#
# LIMITS, stated once in packages/auto-split-contract/src/limits.ts and repeated here as defence in
# depth: a request body is at most 4,198,400 bytes (six 512 KiB PNGs in base64 plus 4 KiB), so the
# body ceiling below is that rounded up to whole KiB; an analysis may take up to the service's own
# 150 s provider deadline, so the read timeout is longer than that and shorter than nothing else.
#
# NOTHING IS LOGGED HERE THAT CARRIES A PAYLOAD: nginx's access log records the request line and
# status, which for this location is a POST to one fixed path. The body is never logged.
#
# Every location that sets a header re-includes the security headers snippet, for the reason
# explained in cad-fixer-security-headers.conf.
location = /api/auto-split/analyze {
    include /etc/nginx/snippets/cad-fixer-security-headers.conf;
    add_header Cache-Control "no-store" always;

    limit_except POST {
        deny all;
    }

    client_max_body_size 4100k;
    client_body_timeout 30s;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    # The browser cancels by closing the connection; the service aborts its provider call when this
    # connection closes, so nginx must not keep the upstream request alive after the client leaves.
    proxy_ignore_client_abort off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 200s;
    proxy_buffering off;
    proxy_request_buffering on;
}

# A readiness probe for the host's own monitoring; it answers `{ok:true,inFlight:n}` and nothing else.
location = /api/auto-split/health {
    include /etc/nginx/snippets/cad-fixer-security-headers.conf;
    add_header Cache-Control "no-store" always;
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 5s;
}

# Anything else under /api/auto-split/ is not part of the product.
location /api/auto-split/ {
    return 404;
}
